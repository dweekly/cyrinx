name: CyrinxHIL
options:
  minimumXcodeGenVersion: 2.39.0
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  Cyrinx:
    path: ../..
targets:
  CyrinxHILiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: iOS/App
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Cyrinx HIL iOS
        NSMicrophoneUsageDescription: Cyrinx HIL needs microphone access for ultrasonic testing.
        UILaunchScreen: {}
        # File sharing so the Mac harness can push/pull PCM + result.json via
        # `xcrun devicectl device copy ... --domain-type appDataContainer`.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dweekly.cyrinx.hil.ios
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V83C69HYSQ
    dependencies:
      - package: Cyrinx
        product: Cyrinx

  CyrinxHILMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared
      - path: macOS/App
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Cyrinx HIL macOS
        NSMicrophoneUsageDescription: Cyrinx HIL needs microphone access for ultrasonic testing.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dweekly.cyrinx.hil.macos
    dependencies:
      - package: Cyrinx
        product: Cyrinx

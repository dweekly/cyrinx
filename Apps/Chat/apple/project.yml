name: CyrinxChat
options:
  minimumXcodeGenVersion: 2.39.0
settings:
  base:
    SWIFT_VERSION: 6.0
# CyrinxChatKit (Apps/Chat/CyrinxChatKit) is the C3-28 contract/simulator
# package -- read-only transport dependency for this effort, per the C3-29
# task brief. CyrinxChatApp (Apps/Chat/apple/CyrinxChatApp) is this effort's
# own local SwiftPM package: ChatModel, launch-arg parsing, the model-trace
# recorder, and chat-model-trace-gen.
packages:
  CyrinxChatKit:
    path: ../CyrinxChatKit
  CyrinxChatApp:
    path: CyrinxChatApp
targets:
  CyrinxChat-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: iOS/App
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Cyrinx Chat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # C3-29 design brief: "Include microphone permission text now, but
        # keep physical audio disabled until C3-31." This sample imports no
        # audio API anywhere (Apps/Chat/apple has zero AVFoundation/
        # CoreAudio imports) -- reserved for the live Cyrinx SDK adapter
        # landing in C3-31, matching Apps/HIL's own Info.plist convention.
        # XcodeGen REGENERATES `iOS/Info.plist` from these `properties` on
        # every `generate.sh` run (verified empirically), so this value
        # must live here, not only in the checked-in plist file.
        NSMicrophoneUsageDescription: >-
          Cyrinx Chat will need microphone access to send and receive
          messages over the acoustic link once the live transport is
          enabled. This build uses only a simulated transport and does not
          access the microphone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dweekly.cyrinx.chat.ios
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V83C69HYSQ
    dependencies:
      - package: CyrinxChatKit
        product: CyrinxChatKit
      - package: CyrinxChatApp
        product: CyrinxChatApp
    scheme:
      testTargets:
        - CyrinxChatUITests-iOS

  CyrinxChat-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
      - path: macOS/App
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Cyrinx Chat
        # See the identical note on CyrinxChat-iOS's `NSMicrophoneUsageDescription`
        # above -- same rationale, same regeneration caveat.
        NSMicrophoneUsageDescription: >-
          Cyrinx Chat will need microphone access to send and receive
          messages over the acoustic link once the live transport is
          enabled. This build uses only a simulated transport and does not
          access the microphone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dweekly.cyrinx.chat.macos
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V83C69HYSQ
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: CyrinxChatKit
        product: CyrinxChatKit
      - package: CyrinxChatApp
        product: CyrinxChatApp
    scheme:
      testTargets:
        - CyrinxChatUITests-macOS

  # XCUITest page objects for discovery/connect/send/receive/degraded/
  # failed-message flows, driven entirely by launch args + the simulated
  # client (CONTRACT.md §5). This is the CI-runnable UI-test target -- see
  # Apps/Chat/apple/CyrinxChatUITests-macOS/README-worthy note in
  # DiscoveryConnectSendReceiveTests.swift's own header comment for the
  # exact scope; per the C3-29/C3-30 design brief, UI-test jobs are not
  # added to CI in this round regardless of platform (documented manual
  # gate), but this target is the one meant to be cheap enough to run in
  # CI in a later round.
  CyrinxChatUITests-macOS:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CyrinxChatUITests-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dweekly.cyrinx.chat.uitests.macos
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V83C69HYSQ
    dependencies:
      - target: CyrinxChat-macOS
      # Reuses the CONTRACT.md §5 accessibility-ID constants (`ChatAccessibilityID`)
      # directly instead of duplicating their string literals -- CyrinxChatKit
      # is a plain Swift package with no UIKit/AppKit dependency, safe to
      # link into an XCUITest bundle.
      - package: CyrinxChatKit
        product: CyrinxChatKit

  # Declared per the design brief ("iOS UI test target declared but
  # runnable manually") but not part of this task's gates -- a documented
  # manual gate, run from Xcode against an iOS Simulator, not CI. Shares
  # the same page-object sources as the macOS target where they are
  # platform-neutral (XCUIApplication launch-arg plumbing, accessibility-ID
  # lookups); see that target's own header comments for per-flow detail.
  CyrinxChatUITests-iOS:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CyrinxChatUITests-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dweekly.cyrinx.chat.uitests.ios
    dependencies:
      - target: CyrinxChat-iOS
      - package: CyrinxChatKit
        product: CyrinxChatKit

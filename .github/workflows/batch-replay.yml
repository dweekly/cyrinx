name: Batch replay

on:
  push:
    branches:
      - main
    paths: &inputs
      - 'Sources/CCyrinx/**'
      - 'Sources/Cyrinx/BatchPHY.swift'
      - 'Tests/BatchReplay/**'
      - 'Tests/Fixtures/conformance/**'
      - 'Tests/Fixtures/golden/**'
      - 'scripts/check-batch-replay.py'
      - 'scripts/android_batch_replay.py'
      - '.github/workflows/batch-replay.yml'
  pull_request:
    paths: *inputs

jobs:
  digital:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate Kotlin compiler
        run: command -v kotlinc || brew install kotlin
      - name: Compare C, Swift and Kotlin/JNI with both FFT backends
        run: |
          python3 -m venv .venv
          .venv/bin/python scripts/check-batch-replay.py --digital-only
      - name: Reject an intentionally reversed Kotlin mask
        run: .venv/bin/python Tests/BatchReplay/check-mask-order.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-replay
          path: artifacts/conformance/november-batch.json

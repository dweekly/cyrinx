name: repository-gates

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-claims-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claims:
    name: Documentation claims gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned ripgrep
        env:
          RIPGREP_VERSION: "14.1.1"
          RIPGREP_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
        run: |
          ripgrep_archive="$RUNNER_TEMP/ripgrep.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$ripgrep_archive" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "$RIPGREP_SHA256  $ripgrep_archive" | sha256sum --check --status
          tar --extract --gzip --file "$ripgrep_archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl" >>"$GITHUB_PATH"
      - name: Verify negative fixtures
        run: ./scripts/check-claims.sh --self-test
      - name: Check repository claims
        run: ./scripts/check-claims.sh

  static-analysis:
    name: Format, vendor integrity, and lint
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install static-analysis tools
        run: brew install swift-format swiftlint clang-format shellcheck jq ripgrep
      - name: Report tool versions
        run: |
          swift-format --version
          swiftlint version
          clang-format --version
          shellcheck --version
          jq --version
          rg --version | head -n 1
      - name: Check formatting and vendored sources
        run: ./scripts/format-check.sh
      - name: Check SwiftLint baseline and shell scripts
        run: ./scripts/lint.sh

name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build, Lint, and Test
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Development Tools
        run: |
          brew update
          # Install command-line formatters and linters.
          # Note: swiftlint, shellcheck, and clang-format are typically pre-installed,
          # but we run brew install to ensure they are present and updated.
          brew install swiftlint shellcheck clang-format || true
          # swift-format check
          brew install swift-format || true

      - name: Format Check
        run: ./scripts/format-check.sh

      - name: Lint Analysis
        run: ./scripts/lint.sh

      - name: Swift Build and Test
        run: swift test

      - name: Build Android HIL App
        if: hashFiles('Apps/HIL/android/build.gradle.kts') != ''
        run: |
          cd Apps/HIL/android
          chmod +x gradlew
          ./gradlew assembleDebug

included:
  - Sources
  - Tests
excluded:
  - .build

line_length:
  warning: 110
  error: 140
  ignores_comments: true

reporter: xcode

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - operator_usage_whitespace
  - overridden_super_call
  - private_action
  - private_outlet
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

analyzer_rules: []

disabled_rules:
  - force_cast
  - identifier_name
  - inclusive_language
  - opening_brace
